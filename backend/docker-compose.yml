# Local development services for PharmaCore.
# Usage: docker compose up -d db redis
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pharmacore
      POSTGRES_PASSWORD: pharmacore
      POSTGRES_DB: pharmacore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pharmacore
      MINIO_ROOT_PASSWORD: pharmacore123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
