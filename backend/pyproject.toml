# Tooling configuration for the PharmaCore backend (Django).
# Dependencies live in requirements*.txt; this file configures the toolchain
# per docs/development/coding-standards.md.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["config", "apps", "tests"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# A standalone Django script must call django.setup() before importing any app
# module, so its imports cannot all sit at the top of the file.
"seed_demo_runner.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ['migrations/']

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

# Tests assert behaviour; they are not an API anyone types against. The root
# ``tests/`` tree is not type-checked at all, so requiring annotations only for
# the few suites that happen to live inside an app package was inconsistent.
[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["xhtml2pdf.*", "segno.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*"]
